name: Auto Weekly Post

on:
  schedule:
    - cron: '0 0 * * MON' # every Monday 00:00 UTC (09:00 KST)
  workflow_dispatch: # allow manual trigger

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Ensure posts directory exists
        run: mkdir -p posts

      - name: Run post generator script
        run: node generate_posts.js

      - name: Install pandoc (for markdown to HTML conversion)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build posts to HTML
        run: bash build_posts.sh

      - name: Commit and push new post
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add posts/*.md public/posts/*.html
          git commit -m "auto: weekly post $(date +'%Y-%m-%d')"
          git push origin main
